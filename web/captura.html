<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estúdio SVG · Apresentação e captura</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0a08;color:#f5e6d2;font-family:system-ui,sans-serif;width:100%;height:100%}#screen{position:fixed;inset:0;display:grid;place-items:center;background:#080807;overflow:hidden}#stage{width:100%;height:100%;display:grid;place-items:center}#stage svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%}#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#19130ed9;padding:12px;border:1px solid #7b4931;border-radius:14px;max-width:96vw;z-index:5}button{border:1px solid #a77452;background:#483025;color:#ffe9ce;border-radius:8px;padding:9px;font-size:14px}#msg{font-size:12px;max-width:280px;line-height:1.4}#bar.recording{opacity:0;pointer-events:none}#bar.recording:focus-within,#bar.recording:hover{opacity:1;pointer-events:auto}#audio{display:none}#hint{position:fixed;top:8px;left:8px;font-size:12px;background:#21190fb5;padding:7px;border-radius:6px;z-index:4}#bar.recording~#hint{display:none}</style></head><body>
<div id="screen"><div id="stage">Carregando…</div></div><div id="bar"><button id="start">▶ Iniciar</button><button id="stop">■ Parar</button><button id="full">⛶ Tela cheia</button><label><input id="usemix" type="checkbox" checked> Reproduzir mix WAV</label><span id="msg">Use o gravador de tela nativo do Android e inicie a apresentação. Se o som interno não for gravado, combine com o WAV depois.</span></div><div id="hint">Toque para exibir comandos</div><audio id="audio" preload="auto"></audio><script src="/captura.js"></script></body></html>
