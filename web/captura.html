<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estúdio SVG · Apresentação e captura</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0a08;color:#f5e6d2;font-family:system-ui,sans-serif;width:100%;height:100%}#screen{position:fixed;inset:0;display:grid;place-items:center;background:#080807;overflow:hidden}#visualFrame{position:relative;width:100%;height:100%;overflow:hidden}#stage{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center}#stage svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%}#stageVideo{position:absolute;pointer-events:none;z-index:2;background:#100c0a}#stageVideo[hidden]{display:none!important}#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#19130ed9;padding:12px;border:1px solid #7b4931;border-radius:14px;max-width:96vw;z-index:5}button{border:1px solid #a77452;background:#483025;color:#ffe9ce;border-radius:8px;padding:9px;font-size:14px}#msg{font-size:12px;max-width:280px;line-height:1.4}body.presenting #bar{display:none!important}body.presenting.controls-visible #bar{display:flex!important}body.presenting #hint{display:none!important}#audio{display:none}#hint{position:fixed;top:8px;left:8px;font-size:12px;background:#21190fb5;padding:7px;border-radius:6px;z-index:4}</style></head><body>
<div id="screen"><div id="visualFrame"><div id="stage">Carregando…</div><video id="stageVideo" muted playsinline preload="metadata" hidden aria-label="Clipe sobreposto à cena"></video></div></div><div id="bar"><button id="prepare">♬ Preparar áudio</button><button id="start">▶ Iniciar</button><button id="stop">■ Parar</button><button id="full">⛶ Tela cheia</button><label><input id="usemix" type="checkbox" checked> Reproduzir mix WAV</label><span id="msg">Para apresentar com som, toque em Preparar áudio e depois em Iniciar. No gravador de tela do Android, selecione áudio do dispositivo quando disponível.</span></div><div id="hint">Durante a reprodução, toque no vídeo para mostrar os comandos temporariamente</div><audio id="audio" preload="auto"></audio><script src="/captura.js"></script></body></html>
