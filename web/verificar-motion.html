<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar composição WebGL</title>
<style>body{font:16px system-ui;background:#15191f;color:#edf3f2;margin:1rem}button{padding:.65rem}canvas{display:block;width:min(100%,640px);margin:.5rem 0}iframe{width:100%;height:400px;border:0}output{display:block;white-space:pre-wrap;margin:1rem 0}</style>
<h1>Verificar composição WebGL</h1><button id="m12RuntimeProbe" type="button">Inspecionar runtime executado</button><output id="m12RuntimeOutput" role="status" aria-live="polite"></output><button id="run">Testar 0,25 → 2 → 0,25 s</button>
<output id="result" role="status">A demonstração abre abaixo.</output><div id="frames"></div>
<iframe id="studio" title="Demonstração no Studio" src="/?project=motion_spatial"></iframe>
<script type="module">

// RD_M12_PIVOT_EXPLICIT: diagnóstico não destrutivo da consulta exposta ao Studio.
const probeButton=document.querySelector('#m12RuntimeProbe');
probeButton.onclick=async()=>{
 const output=document.querySelector('#m12RuntimeOutput');
 output.textContent='Inspecionando iframe e fontes HTTP...';probeButton.disabled=true;
 try{
  const w=document.querySelector('#studio').contentWindow;
  const frame=w.document.getElementById('ssViewportFrame');
  if(!frame?.contentWindow)throw Error('Iframe SpatialSeed ainda ausente.');
  const inner=frame.contentWindow, app=inner.__SPATIAL_SEED__;
  if(!app)throw Error('SpatialSeed não inicializado. Abra o projeto e ative WebGL.');
  const cap=app.capabilities?.();
  const list=Array.isArray(cap?.queries)?cap.queries:[];
  const listed=list.some(x=>x?.id==='viewer.frame.capture');
  const url='/spatialseed-main/apps/web/bootstrap/createWebRuntime.js?m12='+Date.now();
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw Error('Módulo HTTP: '+response.status);
  const text=await response.text(),data=new TextEncoder().encode(text);
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),n=>n.toString(16).padStart(2,'0')).join('');
  const resources=inner.performance?.getEntriesByType('resource')||[];
  const modules=resources.filter(x=>/createWebRuntime\.js|\/boot\.js/.test(x.name)).map(x=>x.name).slice(-8);
  const parts=['Página: '+inner.location.href,
   'Consulta registrada no arquivo HTTP: '+String(text.includes('"viewer.frame.capture"')),
   'SHA-256 do módulo HTTP: '+hash,
   'Consulta anunciada em capabilities(): '+String(listed),
   'Queries anunciadas: '+list.length,
   'Módulos solicitados pelo navegador: '+JSON.stringify(modules)];
  try{parts.push('Relógio world: '+JSON.stringify(app.query('time.domain',{id:'world'})));}
  catch(e){parts.push('Relógio world: FALHOU '+String(e?.message||e));}
  try{
   const image=await app.query('viewer.frame.capture');
   parts.push('Consulta executada: PASS ('+(image?.width||'?')+'×'+(image?.height||'?')+')');
   image?.close?.();
  }catch(e){parts.push('Consulta executada: FALHOU '+String(e?.message||e));}
  output.textContent=parts.join('\n');
 }catch(e){output.textContent='DIAGNÓSTICO INCOMPLETO: '+String(e?.message||e);}
 finally{probeButton.disabled=false;}
};
const run=document.querySelector('#run'), result=document.querySelector('#result'), host=document.querySelector('#frames');
async function digest(canvas){
 const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
 const hash=await crypto.subtle.digest('SHA-256',pixels);
 return Array.from(new Uint8Array(hash),n=>n.toString(16).padStart(2,'0')).join('');
}
run.onclick=async()=>{
 run.disabled=true;host.replaceChildren();let provider;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
 try{
  const {plan,prepareEntry,paintOffline}=await import('./browser-render.mjs');
  const win=document.querySelector('#studio').contentWindow;
  const response=await fetch('/api/project?name=motion_spatial',{signal:controller.signal});
  if(!response.ok)throw Error('O projeto motion_spatial precisa estar instalado.');
  const {project}=await response.json(),scene=project.cenas[0];
  if(!scene.spatialseed_viewport?.enabled)throw Error('A demonstração exige a cena WebGL ativa.');
  while(!(provider=win.StudioSpatialSeedViewport)){
   controller.signal.throwIfAborted();await new Promise(r=>setTimeout(r,100));
  }
  window.StudioSpatialSeedViewport=provider;
  const settings=plan(project),entry=await prepareEntry(settings.entries[0],project,controller.signal,[]);
  provider.beginExport();
  const nativeHashes=[],mixHashes=[];
  for(const t of [.25,2,.25]){
   result.textContent='Renderizando '+t+' s…';
   const image=await provider.frameAtOffline(scene,t,settings.width/settings.height,controller.signal);
   const canvas=document.createElement('canvas');canvas.width=settings.width;canvas.height=settings.height;
   const ctx=canvas.getContext('2d',{willReadFrequently:true});
   try{ctx.drawImage(image,0,0,canvas.width,canvas.height);}finally{image.close();}
   nativeHashes.push(await digest(canvas));
   const app=win.document.querySelector('#ssViewportFrame').contentWindow.__SPATIAL_SEED__;
   const clock=app.query('time.domain',{id:'world'});
   if(!clock.paused||Math.abs(clock.localTime-t)>1e-7)throw Error('Relógio WebGL divergente.');
   await paintOffline(ctx,canvas,entry,t,settings,controller.signal);
   mixHashes.push(await digest(canvas));host.append(canvas);
  }
  for(const hashes of [nativeHashes,mixHashes]){
   if(hashes[0]!==hashes[2]||hashes[0]===hashes[1])throw Error('Pixels inconsistentes ou câmera imóvel: '+hashes.join(' / '));
  }
  if(nativeHashes.some((h,i)=>h===mixHashes[i]))throw Error('Sobreposição SVG ausente.');
  result.textContent='PASS · relógio, WebGL e composição repetíveis.\nWebGL '+nativeHashes.join(' / ')+'\nComposição '+mixHashes.join(' / ');
 }catch(e){result.textContent='FALHOU · '+e.message;}
 finally{clearTimeout(timer);provider?.endExport();delete window.StudioSpatialSeedViewport;run.disabled=false;}
};
</script></html>
