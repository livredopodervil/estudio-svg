<html lang="pt-BR" data-slug="higiene-do-sono"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estúdio SVG — Player vetorial</title><style>*{box-sizing:border-box}html{color-scheme:dark;font:15px system-ui,sans-serif}body{margin:0;background:#0b1017;color:#e9f1f6}header{padding:10px 14px;background:#1e2936;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}a{color:#b4e2ff}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}button,select{font:inherit;background:#304254;color:white;border:1px solid #758b9e;padding:7px 10px;border-radius:6px}input[type=range]{accent-color:#e0b766}.screen{height:min(72dvh,780px);border:1px solid #3d4b5b;background:black;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}#stage{height:100%;width:100%;display:flex;align-items:center;justify-content:center}#stage svg{max-width:100%;max-height:100%;height:100%;width:100%}#seek{width:100%}#status{color:#bbcedb}#stageShell:fullscreen{height:100dvh;width:100vw;border:0;border-radius:0}@media(max-width:650px){.screen{height:58dvh}header,main{padding:8px}}#stageShell{position:relative}#stageShell:fullscreen{background:#000}#fullControls{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);gap:8px;z-index:10;padding:8px;background:#101820dd;border-radius:8px;white-space:nowrap}#stageShell:fullscreen.controls-visible #fullControls{display:flex}</style></head><body>
<header><strong>Estúdio SVG · Player vetorial V3 experimental</strong><a href="../portal/">Voltar ao portal</a><a id="separate" href="#" target="_blank" rel="noopener" hidden>↗ Abrir separado</a></header>
<main><div class="toolbar"><button id="play">▶ Reproduzir</button><button id="full">⛶ Tela cheia</button><select id="pivotTarget" aria-label="Objeto cujo eixo será ajustado" hidden></select><button id="calibrate" type="button">⊙ Ajustar eixo</button><label><input id="narrate" type="checkbox" checked> Narrar</label><label>Reprodução <select id="speed"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label><label>Voz <input id="rate" type="range" min="0.8" max="2.0" value="1.40" step="0.05"><output id="rateOut">1.40×</output></label><label>Fonte <select id="voiceSource"><option value="browser">Voz do navegador</option><option value="recorded">Áudio gravado</option><option value="auto">Automática</option><option value="none">Sem voz</option></select></label><label>Voz <select id="voiceName"><option value="">Automática</option></select></label><label>Idioma da voz <select id="lang"><option value="pt-BR">Português (Brasil)</option><option value="en-US">English</option><option value="es-ES">Español</option><option value="fr-FR">Français</option></select></label></div>
<div id="stageShell" class="screen"><div id="stage" aria-label="Apresentação"></div><div id="fullControls"><button id="fullPlay" type="button">▶ / Ⅱ</button><button id="fullExit" type="button">Sair da tela cheia</button></div></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição"><div><span id="clock">00:00</span> · <span id="scene"></span></div><p id="loadedProject" role="status"></p><p id="clipStatus" role="status"></p><p id="status" role="status">Carregando…</p><p style="font:13px system-ui;color:#b8cfe0">Se o áudio não tocar no Facebook, use Reproduzir após abrir e, se necessário, o menu do aplicativo para abrir no navegador externo.</p></main>
<script>window.__voiceFiles={};window.__voiceSceneFiles={};</script><script src="./runtime.js?v=rd-v3-single-engine-15"></script><script src="./media_layer.js?v=5"></script><script src="./v34/voice_locale.js"></script><script src="./player.js?v=rd-v3-single-engine-15"></script></body></html>
